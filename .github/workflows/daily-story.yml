name: 白凝每日可預約限動
on:
  schedule:
    - cron: '50 0 * * *' # 台北時間 08:50 觸發；程式等待至 09:00 讀取行事曆
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只驗證行事曆、產圖與 Pages，不發布 IG'
        type: boolean
        default: false
      bootstrap_only:
        description: '只建立 Instagram 長期權杖，不發布 IG'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whitening-story-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/calendar-key.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
      META_IG_APP_SECRET: ${{ secrets.META_IG_APP_SECRET }}
      META_IG_AUTH_CODE: ${{ secrets.META_IG_AUTH_CODE }}
      DRY_RUN: ${{ inputs.dry_run }}
      BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_OWNER_USER_ID: ${{ secrets.LINE_OWNER_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: Install Calendar credential
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - id: prepare
        name: Read calendar and prepare story
        run: python workflow.py prepare
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
      - name: Publish Instagram Story
        if: steps.prepare.outputs.publish == 'true' && !inputs.dry_run
        env:
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python workflow.py publish
      - name: Remove Calendar credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
